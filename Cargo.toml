[package]
name = "hnl-engine-eqsat"
version = "0.1.0"
edition = "2024"
description = "The e-graph search interpretation over kernel `Term`s (ADR-0174 P2 / ADR-0175): equality saturation + deterministic extraction, speaking only `hnl_engine::Term` at the boundary."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/engine-eqsat"
readme = "README.md"
keywords = ["handl", "engine", "egraph", "equality-saturation", "search"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-eqsat (no crates.io).
publish = false

[dependencies]
# egraph — the finished e-graph substrate (union-find, compiled matcher,
# bounded saturation, deterministic extraction, ProofEdge provenance,
# and the total kernel<->pattern `term_bridge`).
handl-egraph = { git = "https://github.com/handl-lang/egraph", branch = "main" }
# engine — the arrow-calculus `Term` kernel; the interpretation's only
# term type at the boundary.
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# kit-eqsat — the canonical home of the LAW_FORMAT=2 corpus
# (ADR-0177 §1 / ADR-0178): the contract tests decode the packs
# through `LAW_PACKS`/`law_pack(name).json` instead of vendoring
# `laws/*.json`. Dev-dep only: the shipped crate's corpus is the
# `builtin` constructors; the JSON records are test fixtures +
# `emit_laws` output destined for kit-eqsat's `data/laws/`.
handl-kit-eqsat = { git = "https://github.com/handl-lang/kit-eqsat", branch = "main" }

# dev-link: begin
[patch."https://github.com/handl-lang/egraph"]
handl-egraph = { path = "../egraph" }
[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }
[patch."https://github.com/handl-lang/kernel"]
handl-defining-handl = { path = "../kernel/crates/defining-handl" }
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-ext = { path = "../kernel/crates/handl-ext" }
handl-language = { path = "../kernel/crates/handl-language" }
handl-ops = { path = "../kernel/crates/handl-ops" }
handl-value = { path = "../kernel/crates/handl-value" }
handl-lib-ops = { path = "../kernel/crates/ops" }
handl-lib-prim = { path = "../kernel/crates/prim" }
handl-lib-prim-handl = { path = "../kernel/crates/prim-handl" }
[patch."https://github.com/handl-lang/kit-eqsat"]
handl-kit-eqsat = { path = "../kit-eqsat/crates/handl-kit-eqsat" }
# dev-link: end

[patch."https://github.com/handl-lang/lib-bytes"]
handl-lib-bytes = { path = "../lib-bytes" }

[patch."https://github.com/handl-lang/lib-cmp"]
handl-lib-cmp = { path = "../lib-cmp" }

[patch."https://github.com/handl-lang/lib-error"]
handl-lib-error = { path = "../lib-error" }

[patch."https://github.com/handl-lang/lib-mood"]
handl-lib-mood = { path = "../lib-mood" }

[patch."https://github.com/handl-lang/lib-obj"]
handl-lib-obj = { path = "../lib-obj" }

[patch."https://github.com/handl-lang/lib-comb"]
handl-lib-comb = { path = "../lib-comb" }

[patch."https://github.com/handl-lang/lib-type"]
handl-lib-type = { path = "../lib-type" }
